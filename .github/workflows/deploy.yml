name: Docs

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # daily: the coverage check against the newest agent-mem commit
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Abuarchiv/agent-mem
          path: agent-mem-src
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Coverage against agent-mem
        run: npx tsx scripts/check-coverage.ts
        env:
          AGENT_MEM_SRC: agent-mem-src
      - name: Build
        run: npx astro build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
